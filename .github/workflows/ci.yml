name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 skills/agent-native-repository/scripts/docs_map_check.py
      - run: sh -n skills/agent-native-repository/scripts/pre-push-sync.sh
      - run: python3 -m py_compile skills/agent-native-repository/scripts/*.py
