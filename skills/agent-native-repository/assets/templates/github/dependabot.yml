# Template. One block per ecosystem the repository uses. Weekly, grouped so a
# week costs one or two PRs instead of one per package; majors arrive alone.
version: 2
updates:
  - package-ecosystem: <npm|pip|gomod|cargo|maven|gradle|nuget|bundler|composer>
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ['*']
